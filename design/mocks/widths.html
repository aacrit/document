<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Side by side · Document mocks</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  html, body { margin: 0; }
  body { padding: 16px; display: flex; gap: 24px; align-items: flex-start; }
  figure { margin: 0; display: grid; gap: 8px; }
  figcaption { font: 500 10.5px/1.3 var(--font-data); letter-spacing: var(--track-eyebrow); text-transform: uppercase; color: var(--color-cream-muted); }
  iframe { border: 1px solid var(--color-border); border-radius: 12px; background: var(--color-letterbox); display: block; height: 900px; }
</style>
</head>
<body>
<script>
  // Mock only: ?p=correct.html&w=768,375 lays one page out at several widths, each frame as tall as its page.
  const q = new URLSearchParams(location.search);
  const page = q.get("p") || "correct.html";
  for (const w of (q.get("w") || "768,375").split(",")) {
    const fig = document.createElement("figure");
    const cap = document.createElement("figcaption");
    cap.textContent = page.replace(".html", "") + " at " + w + " px";
    const f = document.createElement("iframe");
    f.src = page; f.style.width = w + "px"; f.title = cap.textContent;
    f.onload = () => { f.style.height = f.contentDocument.documentElement.scrollHeight + "px"; };
    fig.append(cap, f); document.body.append(fig);
  }
</script>
</body>
</html>
