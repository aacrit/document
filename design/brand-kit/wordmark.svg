<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 72" width="400" height="72" role="img" aria-label="void document wordmark">
  <!--
    The wordmark: logomark, then "void" in the data face (JetBrains Mono 500)
    and "document" in the display face (Fraunces 300), lowercase always, on
    one baseline. Live text with the self-hosted faces' names; outline to
    paths before sending the file anywhere the fonts are not installed.
    Colours cite design/tokens.css: --doc-bone #ede2cf, --doc-safelight #eda23c.
  -->
  <g transform="translate(0,7) scale(2.4)">
    <g fill="none" stroke="#ede2cf" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 8V4.5H7"/>
      <path d="M17 4.5h3.5V8"/>
      <path d="M20.5 16v3.5H17"/>
      <path d="M7 19.5H3.5V16"/>
      <circle cx="12" cy="12" r="4.2"/>
    </g>
    <circle cx="18.6" cy="17.6" r="1.25" fill="#eda23c"/>
  </g>
  <text x="78" y="51" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" font-size="42" fill="#ede2cf">void</text>
  <text x="196" y="51" font-family="'Fraunces', ui-serif, Georgia, serif" font-weight="300" font-size="42" fill="#ede2cf">document</text>
</svg>
