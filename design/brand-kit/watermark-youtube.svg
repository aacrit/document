<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="150" height="150" role="img" aria-label="void document YouTube branding watermark">
  <!--
    YouTube branding watermark source (export: 150 x 150, transparent PNG,
    under 1 MB; motion.py writes watermark-youtube-150.png). YouTube draws it
    bottom right at its own low opacity, so there is no halo and no opacity
    here: full bone strokes and the ember. Colours cite design/tokens.css:
    --doc-bone #ede2cf, --doc-safelight #eda23c.
  -->
  <g fill="none" stroke="#ede2cf" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 8V4.5H7"/>
    <path d="M17 4.5h3.5V8"/>
    <path d="M20.5 16v3.5H17"/>
    <path d="M7 19.5H3.5V16"/>
    <circle cx="12" cy="12" r="4.2"/>
  </g>
  <circle cx="18.6" cy="17.6" r="1.25" fill="#eda23c"/>
</svg>
