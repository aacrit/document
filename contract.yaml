# The served-page contract. scripts/contract.mjs runs every check in `checks`
# against `url` (or the URL passed to `--url`) and exits non-zero if any fail.
# A check tagged `requires: deployed` needs the Cloudflare runtime and is
# reported as SKIP against a localhost URL; it must PASS on the preview.
# `events.allowed` and `events.server_only` are the source of truth that
# worker/src/config.ts mirrors; tests/contract-events.test.ts keeps them in
# sync.
url: https://document.voidvision.org
# Bursts measure the Worker's own limit. On the production domain the zone's
# WAF rule (30 per 10 s per IP) blocks a burst first with its own 1015 page, so
# a burst aimed at a host under `burst_zone` goes to `burst_host` instead: the
# same deployment's workers.dev address, which the zone's rules do not cover.
# The runner first requires burst_host's /healthz build to equal production's.
# workers_dev must stay on (wrangler.jsonc) for that.
burst_zone: voidvision.org
burst_host: https://document.aacrit.workers.dev

checks:
  - name: homepage status 200
    type: status
    path: /
    expect: 200

  - name: homepage names the product
    type: contains
    path: /
    text: "void document"

  - name: homepage carries a build marker
    type: meta
    path: /
    meta_name: build

  # Every registered film's checks, from the films block below (one set per
  # film in films.json), go here.
  - expand: films

  - name: privacy page responds
    type: status
    path: /privacy
    expect: 200

  - name: healthz responds
    type: status
    path: /healthz
    expect: 200

  - name: healthz reports ok
    type: json
    path: /healthz
    field: ok
    expect: true

  - name: homepage has no leftover placeholders
    type: forbidden
    path: /
    strings:
      - "undefined"
      - "NaN"
      - "lorem"
      - "TODO"
      - "__"
      - "core_success_event"

  - name: homepage carries no anonymous-id telemetry
    type: forbidden
    path: /
    strings:
      - "anon-id"
      - "localStorage.setItem(\"anon"

  - name: homepage loads nothing from a font CDN
    type: forbidden
    path: /
    strings:
      - "fonts.googleapis.com"
      - "fonts.gstatic.com"

  # Headers a <meta> tag cannot carry. Static pages get them from
  # dist/_headers (scripts/build.mjs), Worker responses from
  # worker/src/headers.ts.
  - name: homepage cannot be framed (CSP)
    type: header
    path: /
    header: content-security-policy
    contains: "frame-ancestors 'none'"

  - name: homepage cannot be framed (X-Frame-Options)
    type: header
    path: /
    header: x-frame-options
    expect: DENY

  - name: homepage is not content-sniffed
    type: header
    path: /
    header: x-content-type-options
    expect: nosniff

  - name: homepage sends no referrer
    type: header
    path: /
    header: referrer-policy
    expect: no-referrer

  - name: homepage loads fonts from its own origin only
    type: header
    path: /
    header: content-security-policy
    contains: "font-src 'self'"

  - name: healthz carries the API policy
    type: header
    path: /healthz
    header: content-security-policy
    expect: "default-src 'none'; frame-ancestors 'none'"

  - name: healthz cannot be framed (X-Frame-Options)
    type: header
    path: /healthz
    header: x-frame-options
    expect: DENY

  # The per-client rate limit actually bites. The Workers Rate Limiting
  # binding only counts on Cloudflare, so this runs against the preview and
  # production only. It must be the Worker's own refusal, not a WAF 1015
  # page (also a 429), and it waits out the WAF's 10 s window first.
  # The binding counts permissively, so the burst goes 20 at a time: 25
  # sequential requests never tripped it (Dial's Spark release, 2026-09-26).
  - name: rate limit bites on the Worker (deployed only)
    type: burst
    path: /healthz
    count: 80
    concurrency: 20
    expect_status: 429
    expect_error: rate_limited
    pause_before_seconds: 11
    requires: deployed

# The film checks, once per film in films.json (scripts/contract.mjs expands
# them where `checks` says `expand: films`). In each string, {slug}, {title}
# and {shows} are the film's; {lang} and {label} a published caption track's;
# {href} a related link's; {poster} the film's poster file. `for` says which
# films a check is for: live (the default), coming, or marquee (the live film
# on the home marquee). `each: caption` repeats a check for every caption
# track whose review is done; `each: related` for every related link; `if:
# poster` keeps it only when the film names a poster. A coming film is
# listed on the home page and has no page and no media: nothing here
# requires its media until films.json says it is live.
films:
  registry: films.json
  checks:
    - name: homepage names {title}
      for: [live, coming]
      type: contains
      path: /
      text: "{title}"

    - name: homepage links to {title}
      type: contains
      path: /
      text: "/f/{slug}/"

    - name: homepage says what {title} does not show
      for: [marquee]
      type: contains
      path: /
      text: "{shows}"

    - name: "{title} has no page until it is live"
      for: [coming]
      type: status
      path: /f/{slug}/
      expect: 404

    - name: "{title}: film page responds"
      type: status
      path: /f/{slug}/
      expect: 200

    - name: "{title}: film page carries the player and its media"
      type: contains
      path: /f/{slug}/
      text: "/media/{slug}/film.mp4"

    - name: "{title}: film page carries the {label}"
      each: caption
      type: contains
      path: /f/{slug}/
      text: "/media/{slug}/captions-{lang}.vtt"

    - name: "{title}: film page says what the marks mean"
      type: contains
      path: /f/{slug}/
      text: "What the marks mean"

    - name: "{title}: film page links to {href}"
      each: related
      type: contains
      path: /f/{slug}/
      text: "{href}"

    - name: "{title}: sources page responds"
      type: status
      path: /f/{slug}/sources/
      expect: 200

    - name: "{title}: sources page carries the balance"
      type: contains
      path: /f/{slug}/sources/
      text: "Whose words, and how long"

    - name: "{title}: corrections page responds"
      type: status
      path: /f/{slug}/correct/
      expect: 200

    - name: "{title}: corrections page carries the form"
      type: contains
      path: /f/{slug}/correct/
      text: "Correct something in"

    - name: "{title}: every page names the void family"
      type: contains
      path: /f/{slug}/sources/
      text: "void document is part of void, with"

    - name: "{title}: the film page carries no studio words"
      type: forbidden
      path: /f/{slug}/
      strings:
        - "/studio"
        - "render"
        - "pipeline"

    - name: "{title}: the film is served (deployed only)"
      type: status
      path: /media/{slug}/film.mp4
      expect: 200
      requires: deployed

    - name: "{title}: the sources timeline is served (deployed only)"
      type: status
      path: /media/{slug}/sources.json
      expect: 200
      requires: deployed

    - name: "{title}: the {label} are served (deployed only)"
      each: caption
      type: status
      path: /media/{slug}/captions-{lang}.vtt
      expect: 200
      requires: deployed

    - name: "{title}: the poster is served (deployed only)"
      if: poster
      type: status
      path: /media/{slug}/{poster}
      expect: 200
      requires: deployed

    - name: "{title}: the film served is the encode sources.json records (deployed only)"
      type: sha256_matches
      path: /media/{slug}/film.mp4
      sources: /media/{slug}/sources.json
      field: web.film_sha256
      # verify-production runs every 6 hours: compare size and the first and last MiB (two byte ranges), not the whole film.
      max_bytes: 1048576
      requires: deployed

    - name: "{title}: sources.json's recorded web encode runs as long as the film, within a frame (deployed only)"
      type: sources_duration_consistent
      path: /media/{slug}/sources.json
      sources: /media/{slug}/sources.json
      field: web.film_duration_s
      requires: deployed

    - name: "{title}: the poster served is the still sources.json credits (deployed only)"
      if: poster
      type: sha256_matches
      path: /media/{slug}/{poster}
      sources: /media/{slug}/sources.json
      field: poster.sha256
      requires: deployed

    # The trailer is optional: the old trailer does not ship with the revamped
    # film (CoS, 2026-10-10), and the revamp trailer brings it back. When the
    # film's sources.json declares one (publish.py --trailer), it must be served
    # and be those bytes; when it declares none, the path must answer 404, so no
    # stale trailer stays public (release-film.mjs deletes it). Without
    # undeclared_status, an undeclared record would report n/a (not declared).
    - name: "{title}: the trailer is the one sources.json declares, or not served at all (deployed only)"
      type: sha256_matches
      path: /media/{slug}/trailer.mp4
      sources: /media/{slug}/sources.json
      field: trailer.sha256
      when_declared: trailer
      undeclared_status: 404
      max_bytes: 1048576
      requires: deployed

# The zone's one free WAF rate-limiting rule, shared by every product on
# voidvision.org. Not a check: the /release skill confirms the live rule
# matches this before a release, and web/privacy.html discloses what it logs
# (tests/privacy-page.test.ts pairs the two). Blocked requests are recorded
# in Cloudflare's Security Events with IP, path and user agent.
zone_waf_rule:
  name: voidvision worker invocations
  expression: '(not http.request.uri.path wildcard "/assets/*" and not cf.client.bot)'
  characteristic: ip
  requests: 30
  period_seconds: 10
  action: block
  mitigation_timeout_seconds: 10
  logs_blocked_requests: [ip, path, user_agent]

events:
  allowed:
    - page_view
    # Placeholder: rename to the product's core success event at Spark
    # (scripts/lint-events.mjs fails the gate until then).
    - "film_completed"
    # An archive's item link opened from a film's Sources page.
    - source_opened
    - feedback_received
    - rate_limiter_error
  # Counted only by the Worker code that does the thing being counted; /e
  # rejects them, so a client cannot inflate them or exhaust their ceilings.
  server_only:
    - feedback_received
    - rate_limiter_error

# The one event the kill criteria in CHARTER.md count. It must be the
# product's core action completing (an export, an order, a finished task),
# never page views or feedback.
success_event: "film_completed"
