# The score for "Maxwell Street", the first Document portrait, as note data on
# sampled real instruments, in void-history's manifest format (rendered by
# voidnews/pipeline/history/score.py; the samples live in
# ~/.cache/void-score-samples and are pinned by sha256).
#
# The music claims nothing about the place or the people in the photographs.
# It is a slow twelve-bar blues in C, played twice through at 68 beats a
# minute (one beat is 0.882 s, one chorus 42.35 s), because Maxwell Street is
# where Chicago blues went electric (dossier context_facts). It belongs to
# the street without imitating any recording: three instruments, each
# presented as what it is. A double bass, plucked, in a two-feel (root on the
# first beat, fifth or third on the third), the footfall of the street from
# the first frame. An upright piano, the softest layer, the kind of piano a
# boarding house or a tavern on the block would have had, comping the third
# and seventh of each chord on beats two and four, with one small fill at the
# first turnaround and a plain chord left to ring at the close. A tenor
# saxophone, played without vibrato and soft, the singer: it keeps silent for
# the first four bars and sings five phrases in the C minor pentatonic with
# the major sixth and, once, the major third, resting under each narration
# line and singing between them. Nothing in it swells; the mixer ducks it
# under the voice.
#
# Keys. void-history's validator caps a cue named `theme` at 32 s (a title
# statement) and the Document sketch renderer asserts that validator, so the
# film-length cue is keyed `sting:to_document`, the one key in the producer's
# grammar with no length cap, no fold and no mood in its name (and whose name,
# read as English, says what it is: the cue to Document). The `theme` here is a
# true theme: the first eight bars of the same music, 28.5 s. The producer's
# other mandatory keys are declared silent.
